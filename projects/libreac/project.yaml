# libreac: the C library for Roland REAC audio over Ethernet (EtherType 0x8819): frame decode and encode, control
# blocks, stagebox identity and head-amps, discovery, and the pcap reader. Pinned to the merge of
# FreeREAC/libreac#31 into main (issue #28): v1.8.0, the fuzz checks of both reviews, and fuzz_ctrl's address check.
repo: https://github.com/FreeREAC/libreac#79de6db6048e1799e74724032a984e8325f61eb6
primary_contact: linuxnow@gmail.com
homepage: https://github.com/FreeREAC/libreac
language: c
sanitizers: [address, undefined]
fuzz_targets:
  - fuzz_decode
  - fuzz_ctrl
  - fuzz_identity
  - fuzz_disco
  - fuzz_scene
  - fuzz_boxreg
  - fuzz_knock
  - fuzz_grant
  - fuzz_pcap
mutants: fuzz/sabotage
